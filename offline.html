<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You are offline · Creditfy</title>
<meta name="theme-color" content="#0a6e35">
<style>
:root{--p:#1ddb80}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(600px 400px at 50% 0%,rgba(29,219,128,.15),transparent 60%),#060d1a;color:#e2eeff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
.c{max-width:340px}
img{width:84px;height:84px;border-radius:22px;box-shadow:0 14px 34px rgba(10,110,53,.4)}
h1{font-size:20px;margin:18px 0 6px}
p{color:#7b90b4;font-size:14px;line-height:1.6;margin:0 0 20px}
.bn{font-family:"Hind Siliguri",system-ui,sans-serif}
button{border:0;border-radius:14px;padding:13px 22px;font-weight:800;font-size:15px;background:var(--p);color:#03210f;cursor:pointer}
</style>
</head>
<body>
<div class="c">
  <img src="/icons/icon-192.png" alt="">
  <h1>No internet connection</h1>
  <p>Please check your mobile data or Wi-Fi, then try again.<br><span class="bn">ইন্টারনেট সংযোগ নেই। মোবাইল ডেটা বা Wi-Fi চালু করে আবার চেষ্টা করুন।</span></p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
