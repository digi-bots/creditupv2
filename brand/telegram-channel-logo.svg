<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b6e35"/><stop offset="1" stop-color="#0f9e4e"/></linearGradient>
    <radialGradient id="glow" cx=".3" cy=".2" r=".8"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fc1ff"/><stop offset="1" stop-color="#1d8ed8"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#032a14" flood-opacity=".45"/></filter>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc94d"/><stop offset="1" stop-color="#f08a1c"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fc1ff"/><stop offset="1" stop-color="#1d6fd8"/></linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#glow)"/>
  <!-- the Creditfy "C" with growth bars (same shapes as the app icon) -->
  <g transform="translate(-14,-22)">
    <path d="M 391.2 231.9 A 106 106 0 1 0 391.2 368.1" fill="none" stroke="#ffffff" stroke-width="48"/>
    <rect x="266" y="440" width="30" height="58" rx="8" fill="#4ade80"/>
    <rect x="316" y="414" width="30" height="84" rx="8" fill="#4ade80"/>
    <rect x="366" y="380" width="30" height="118" rx="8" fill="#4ade80"/>
  </g>
  <!-- announcement badge: megaphone -->
  <g transform="translate(470,470) scale(.8)" filter="url(#sh)">
    <circle r="88" fill="#ffffff"/>
    <circle r="76" fill="url(#gold)"/>
    <g transform="rotate(-14)">
      <!-- horn -->
      <path d="M -34 -16 L 22 -44 Q 30 -48 30 -38 L 30 38 Q 30 48 22 44 L -34 16 Z" fill="#ffffff"/>
      <!-- back of the speaker -->
      <rect x="-50" y="-18" width="22" height="36" rx="8" fill="#ffffff"/>
      <!-- handle -->
      <path d="M -30 16 L -22 44 Q -20 52 -12 50 L -4 48 Q 3 46 1 38 L -6 18 Z" fill="#ffffff"/>
      <!-- sound waves -->
      <path d="M 44 -22 Q 58 0 44 22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
      <path d="M 56 -36 Q 78 0 56 36" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".85"/>
    </g>
  </g>
</svg>
